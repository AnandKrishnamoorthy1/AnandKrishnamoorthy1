<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Professional recognition ribbon</title>
  <desc id="desc">A slowly scrolling ribbon of professional recognition from project leadership and teammates.</desc>

  <style>
    :root { color-scheme: light dark; }
    .viewport { fill: #f6f8fa; stroke: #d0d7de; }
    .card { fill: #ffffff; stroke: #d8dee4; }
    .primary { fill: #eef6ff; stroke: #54aeff; }
    .quote { fill: #24292f; font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small-quote { fill: #24292f; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .recognition { fill: #24292f; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .attribution { fill: #57606a; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0.04em; }
    .track { animation: recognition-scroll 48s linear infinite; }

    @keyframes recognition-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-1528px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .track { animation-play-state: paused; }
    }

    @media (prefers-color-scheme: dark) {
      .viewport { fill: #161b22; stroke: #30363d; }
      .card { fill: #21262d; stroke: #30363d; }
      .primary { fill: #172b45; stroke: #388bfd; }
      .quote, .small-quote, .recognition { fill: #f0f6fc; }
      .attribution { fill: #8b949e; }
    }
  </style>

  <defs>
    <clipPath id="ribbon-viewport">
      <rect x="0" y="0" width="1200" height="180" rx="12" />
    </clipPath>
  </defs>

  <rect class="viewport" x="0.5" y="0.5" width="1199" height="179" rx="12" />

  <g class="track" clip-path="url(#ribbon-viewport)">
    <g transform="translate(24 20)">
      <rect class="primary" x="0" y="0" width="420" height="140" rx="10" />
      <text class="quote" x="24" y="46">
        <tspan x="24" dy="0">&#8220;Before you and the senior</tspan>
        <tspan x="24" dy="25">engineer joined, the project was</tspan>
        <tspan x="24" dy="25">stuck. Now we have a solution.&#8221;</tspan>
      </text>
      <text class="attribution" x="24" y="114">&#8212; DIRECT MANAGER</text>
    </g>

    <g transform="translate(460 20)">
      <rect class="card" x="0" y="0" width="300" height="140" rx="10" />
      <text class="small-quote" x="22" y="62">
        <tspan x="22" dy="0">&#8220;You were so helpful and</tspan>
        <tspan x="22" dy="22">resourceful during my transition.&#8221;</tspan>
      </text>
      <text class="attribution" x="22" y="114">&#8212; SENIOR ENGINEER</text>
    </g>

    <g transform="translate(776 20)">
      <rect class="card" x="0" y="0" width="260" height="140" rx="10" />
      <text class="small-quote" x="22" y="73">
        <tspan x="22" dy="0">&#8220;Big impact and great</tspan>
        <tspan x="22" dy="22">teamwork!&#8221;</tspan>
      </text>
      <text class="attribution" x="22" y="114">&#8212; PROJECT RECOGNITION</text>
    </g>

    <g transform="translate(1052 20)">
      <rect class="card" x="0" y="0" width="452" height="140" rx="10" />
      <text class="recognition" x="22" y="39">
        <tspan x="22" dy="0">Recognized by a senior Client Partner for</tspan>
        <tspan x="22" dy="19">strong contributions to executive data-strategy</tspan>
        <tspan x="22" dy="19">discussions and recommended to business-unit</tspan>
        <tspan x="22" dy="19">leadership as a highly valuable resource.</tspan>
      </text>
      <text class="attribution" x="22" y="114">&#8212; SENIOR CLIENT PARTNER</text>
    </g>

    <g transform="translate(1552 20)">
      <rect class="primary" x="0" y="0" width="420" height="140" rx="10" />
      <text class="quote" x="24" y="46">
        <tspan x="24" dy="0">&#8220;Before you and the senior</tspan>
        <tspan x="24" dy="25">engineer joined, the project was</tspan>
        <tspan x="24" dy="25">stuck. Now we have a solution.&#8221;</tspan>
      </text>
      <text class="attribution" x="24" y="114">&#8212; DIRECT MANAGER</text>
    </g>

    <g transform="translate(1988 20)">
      <rect class="card" x="0" y="0" width="300" height="140" rx="10" />
      <text class="small-quote" x="22" y="62">
        <tspan x="22" dy="0">&#8220;You were so helpful and</tspan>
        <tspan x="22" dy="22">resourceful during my transition.&#8221;</tspan>
      </text>
      <text class="attribution" x="22" y="114">&#8212; SENIOR ENGINEER</text>
    </g>

    <g transform="translate(2304 20)">
      <rect class="card" x="0" y="0" width="260" height="140" rx="10" />
      <text class="small-quote" x="22" y="73">
        <tspan x="22" dy="0">&#8220;Big impact and great</tspan>
        <tspan x="22" dy="22">teamwork!&#8221;</tspan>
      </text>
      <text class="attribution" x="22" y="114">&#8212; PROJECT RECOGNITION</text>
    </g>

    <g transform="translate(2580 20)">
      <rect class="card" x="0" y="0" width="452" height="140" rx="10" />
      <text class="recognition" x="22" y="39">
        <tspan x="22" dy="0">Recognized by a senior Client Partner for</tspan>
        <tspan x="22" dy="19">strong contributions to executive data-strategy</tspan>
        <tspan x="22" dy="19">discussions and recommended to business-unit</tspan>
        <tspan x="22" dy="19">leadership as a highly valuable resource.</tspan>
      </text>
      <text class="attribution" x="22" y="114">&#8212; SENIOR CLIENT PARTNER</text>
    </g>
  </g>
</svg>
